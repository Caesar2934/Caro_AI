<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1480" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F1E8"/>
      <stop offset="1" stop-color="#E4EEF6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F6FBFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C65D2E"/>
      <stop offset="1" stop-color="#E19A3E"/>
    </linearGradient>
    <linearGradient id="decision" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1D5B79"/>
      <stop offset="1" stop-color="#2E8A99"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#617A8A" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1L11 6L1 11V1Z" fill="#335C67"/>
    </marker>
    <style>
      .title { font: 700 42px 'Segoe UI', Arial, sans-serif; fill: #153243; }
      .subtitle { font: 500 20px 'Segoe UI', Arial, sans-serif; fill: #48616F; }
      .section { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #17384D; }
      .label { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #17384D; }
      .body { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #314B59; }
      .small { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #4A6572; }
      .light { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #F8FCFF; }
      .tiny { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #66808E; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1410" cy="150" r="110" fill="#F2D6B3" opacity="0.35"/>
  <circle cx="190" cy="760" r="140" fill="#BED8E6" opacity="0.4"/>
  <circle cx="1180" cy="730" r="90" fill="#F0C9B5" opacity="0.3"/>

  <text x="110" y="105" class="title">Luồng Hoạt Động Của AI Chơi Cờ Caro</text>
  <text x="110" y="145" class="subtitle">Từ nước đi của người chơi đến quyết định của AI và phản hồi lên giao diện</text>

  <rect x="100" y="190" width="1400" height="600" rx="28" fill="url(#panel)" stroke="#D7E2E8" stroke-width="2" filter="url(#shadow)"/>

  <text x="140" y="235" class="section">1. Tương tác ngoài giao diện</text>
  <text x="650" y="235" class="section">2. Xử lý trong Engine AI</text>
  <text x="1180" y="235" class="section">3. Kết quả trả về</text>

  <rect x="140" y="280" width="240" height="120" rx="22" fill="#FFF7F0" stroke="#E7C5AF" stroke-width="2"/>
  <text x="185" y="328" class="label">Người chơi</text>
  <text x="172" y="360" class="body">Đặt quân X lên bàn cờ</text>
  <text x="174" y="387" class="small">Khởi tạo trạng thái mới</text>

  <rect x="430" y="280" width="260" height="120" rx="22" fill="#F5FBFD" stroke="#B9D8E2" stroke-width="2"/>
  <text x="500" y="328" class="label">Frontend UI</text>
  <text x="455" y="360" class="body">Cập nhật board và gửi</text>
  <text x="465" y="387" class="small">request sang AI Adapter</text>

  <rect x="430" y="455" width="260" height="120" rx="22" fill="#F8F6FF" stroke="#CFC7E8" stroke-width="2"/>
  <text x="490" y="503" class="label">AI Worker</text>
  <text x="458" y="535" class="body">Chạy nền để UI không treo</text>
  <text x="483" y="562" class="small">Nhận board, depth, mode</text>

  <rect x="760" y="280" width="300" height="130" rx="22" fill="url(#decision)" filter="url(#shadow)"/>
  <text x="842" y="325" class="light">WASM Bridge</text>
  <text x="805" y="357" class="light">Nạp ai.wasm / ai.js</text>
  <text x="818" y="387" class="light">Gọi C++ Core Engine</text>

  <rect x="760" y="455" width="300" height="250" rx="26" fill="#EEF7F9" stroke="#B7D6DB" stroke-width="2"/>
  <text x="840" y="495" class="label">C++ AI Core</text>
  <rect x="790" y="520" width="240" height="42" rx="14" fill="#FFFFFF" stroke="#D2E4E8"/>
  <text x="832" y="548" class="body">1. Sinh candidate move</text>
  <rect x="790" y="575" width="240" height="42" rx="14" fill="#FFFFFF" stroke="#D2E4E8"/>
  <text x="811" y="603" class="body">2. Nhận diện pattern cờ</text>
  <rect x="790" y="630" width="240" height="42" rx="14" fill="#FFFFFF" stroke="#D2E4E8"/>
  <text x="811" y="658" class="body">3. Tính điểm heuristic</text>
  <rect x="790" y="685" width="240" height="42" rx="14" fill="#FFFFFF" stroke="#D2E4E8"/>
  <text x="796" y="713" class="body">4. Minimax / Alpha-Beta</text>

  <rect x="1110" y="290" width="330" height="210" rx="24" fill="#FFF8EE" stroke="#E4CCAE" stroke-width="2"/>
  <text x="1184" y="330" class="label">Evaluation Function</text>
  <text x="1142" y="365" class="body">Chấm điểm thế trận bằng pattern:</text>
  <text x="1148" y="398" class="small">• Open Four / Half-Open Four</text>
  <text x="1148" y="428" class="small">• Open Three / Half-Open Three</text>
  <text x="1148" y="458" class="small">• Open Two và các điểm block</text>
  <text x="1160" y="488" class="tiny">Trọng tâm: ưu tiên chặn nước thua ngay</text>

  <rect x="1110" y="550" width="330" height="130" rx="24" fill="url(#accent)" filter="url(#shadow)"/>
  <text x="1183" y="598" class="light">Best Move</text>
  <text x="1148" y="630" class="light">Chọn nước đi có điểm tốt nhất</text>
  <text x="1160" y="660" class="light">kèm time, nodes, score</text>

  <rect x="1110" y="715" width="330" height="50" rx="16" fill="#F2FBF5" stroke="#B8DEC1" stroke-width="2"/>
  <text x="1160" y="747" class="body">UI hiển thị nước đi O của AI</text>

  <path d="M380 340H430" stroke="#335C67" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M560 400V455" stroke="#335C67" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M690 515H760" stroke="#335C67" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1060 345H1110" stroke="#335C67" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1060 580H1110" stroke="#335C67" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1275 680V715" stroke="#335C67" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <path d="M1110 615C1035 615 1015 615 980 615" stroke="#6B8A96" stroke-width="3" stroke-dasharray="9 9"/>
  <path d="M1275 550V500" stroke="#6B8A96" stroke-width="3" stroke-dasharray="9 9"/>

  <rect x="140" y="650" width="550" height="105" rx="22" fill="#FFFFFF" stroke="#D7E2E8" stroke-width="2"/>
  <text x="172" y="692" class="label">Thông điệp chính cho slide</text>
  <text x="173" y="724" class="body">AI không chọn nước đi ngẫu nhiên. Nó mô phỏng các khả năng,</text>
  <text x="173" y="750" class="body">dùng heuristic để đánh giá thế cờ, rồi chọn nước có lợi nhất.</text>

  <text x="116" y="835" class="tiny">Gợi ý sử dụng: chèn SVG trực tiếp vào PowerPoint để giữ độ nét, hoặc export sang PNG nếu cần.</text>
</svg>
