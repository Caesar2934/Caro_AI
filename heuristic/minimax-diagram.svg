<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1480" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F2E9"/>
      <stop offset="1" stop-color="#E7F0F5"/>
    </linearGradient>
    <linearGradient id="maxNode" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D76A38"/>
      <stop offset="1" stop-color="#E8A146"/>
    </linearGradient>
    <linearGradient id="minNode" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2D6276"/>
      <stop offset="1" stop-color="#4A91A5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5D7280" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 700 42px 'Segoe UI', Arial, sans-serif; fill: #16384B; }
      .subtitle { font: 500 20px 'Segoe UI', Arial, sans-serif; fill: #53707C; }
      .label { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #16384B; }
      .body { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #34505D; }
      .light { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #FBFEFF; }
      .small { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #667F8B; }
      .score { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #16384B; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="100" y="90" class="title">Thuật Toán Minimax</text>
  <text x="100" y="128" class="subtitle">MAX chọn giá trị lớn nhất, MIN chọn giá trị nhỏ nhất để mô phỏng hai người chơi đều tối ưu</text>

  <rect x="85" y="160" width="1430" height="680" rx="28" fill="#FFFEFB" stroke="#D7E1E7" stroke-width="2" filter="url(#shadow)"/>

  <line x1="800" y1="255" x2="470" y2="390" stroke="#8AA1AC" stroke-width="4"/>
  <line x1="800" y1="255" x2="1130" y2="390" stroke="#8AA1AC" stroke-width="4"/>

  <line x1="470" y1="430" x2="290" y2="565" stroke="#8AA1AC" stroke-width="4"/>
  <line x1="470" y1="430" x2="650" y2="565" stroke="#8AA1AC" stroke-width="4"/>
  <line x1="1130" y1="430" x2="950" y2="565" stroke="#8AA1AC" stroke-width="4"/>
  <line x1="1130" y1="430" x2="1310" y2="565" stroke="#8AA1AC" stroke-width="4"/>

  <line x1="290" y1="605" x2="220" y2="720" stroke="#B6C5CC" stroke-width="3"/>
  <line x1="290" y1="605" x2="360" y2="720" stroke="#B6C5CC" stroke-width="3"/>
  <line x1="650" y1="605" x2="580" y2="720" stroke="#B6C5CC" stroke-width="3"/>
  <line x1="650" y1="605" x2="720" y2="720" stroke="#B6C5CC" stroke-width="3"/>
  <line x1="950" y1="605" x2="880" y2="720" stroke="#B6C5CC" stroke-width="3"/>
  <line x1="950" y1="605" x2="1020" y2="720" stroke="#B6C5CC" stroke-width="3"/>
  <line x1="1310" y1="605" x2="1240" y2="720" stroke="#B6C5CC" stroke-width="3"/>
  <line x1="1310" y1="605" x2="1380" y2="720" stroke="#B6C5CC" stroke-width="3"/>

  <circle cx="800" cy="240" r="58" fill="url(#maxNode)" filter="url(#shadow)"/>
  <text x="772" y="248" class="light">MAX</text>
  <text x="738" y="318" class="body">AI chọn giá trị lớn nhất</text>

  <circle cx="470" cy="410" r="52" fill="url(#minNode)" filter="url(#shadow)"/>
  <circle cx="1130" cy="410" r="52" fill="url(#minNode)" filter="url(#shadow)"/>
  <text x="447" y="418" class="light">MIN</text>
  <text x="1107" y="418" class="light">MIN</text>

  <circle cx="290" cy="585" r="46" fill="url(#maxNode)" filter="url(#shadow)"/>
  <circle cx="650" cy="585" r="46" fill="url(#maxNode)" filter="url(#shadow)"/>
  <circle cx="950" cy="585" r="46" fill="url(#maxNode)" filter="url(#shadow)"/>
  <circle cx="1310" cy="585" r="46" fill="url(#maxNode)" filter="url(#shadow)"/>
  <text x="268" y="592" class="light">MAX</text>
  <text x="628" y="592" class="light">MAX</text>
  <text x="928" y="592" class="light">MAX</text>
  <text x="1288" y="592" class="light">MAX</text>

  <rect x="185" y="720" width="70" height="52" rx="14" fill="#FFFFFF" stroke="#D9E4E8"/>
  <rect x="325" y="720" width="70" height="52" rx="14" fill="#FFFFFF" stroke="#D9E4E8"/>
  <rect x="545" y="720" width="70" height="52" rx="14" fill="#FFFFFF" stroke="#D9E4E8"/>
  <rect x="685" y="720" width="70" height="52" rx="14" fill="#FFFFFF" stroke="#D9E4E8"/>
  <rect x="845" y="720" width="70" height="52" rx="14" fill="#FFFFFF" stroke="#D9E4E8"/>
  <rect x="985" y="720" width="70" height="52" rx="14" fill="#FFFFFF" stroke="#D9E4E8"/>
  <rect x="1205" y="720" width="70" height="52" rx="14" fill="#FFFFFF" stroke="#D9E4E8"/>
  <rect x="1345" y="720" width="70" height="52" rx="14" fill="#FFFFFF" stroke="#D9E4E8"/>

  <text x="212" y="754" class="score">3</text>
  <text x="352" y="754" class="score">5</text>
  <text x="572" y="754" class="score">2</text>
  <text x="712" y="754" class="score">9</text>
  <text x="872" y="754" class="score">1</text>
  <text x="1012" y="754" class="score">4</text>
  <text x="1232" y="754" class="score">6</text>
  <text x="1372" y="754" class="score">8</text>

  <text x="250" y="655" class="score">max(3,5)=5</text>
  <text x="610" y="655" class="score">max(2,9)=9</text>
  <text x="910" y="655" class="score">max(1,4)=4</text>
  <text x="1270" y="655" class="score">max(6,8)=8</text>

  <text x="405" y="495" class="score">min(5,9)=5</text>
  <text x="1065" y="495" class="score">min(4,8)=4</text>
  <text x="755" y="395" class="score">max(5,4)=5</text>

  <rect x="110" y="790" width="1380" height="38" rx="14" fill="#F2F8FA" stroke="#D8E4E8"/>
  <text x="170" y="815" class="body">Kết luận: MAX ở gốc sẽ chọn nhánh trái vì sau khi xét phản ứng tốt nhất của đối thủ, giá trị nhận được là 5.</text>
</svg>
