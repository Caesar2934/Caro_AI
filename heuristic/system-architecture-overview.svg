<svg width="1800" height="1100" viewBox="0 0 1800 1100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="100" y1="80" x2="1700" y2="1020" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F2E9"/>
      <stop offset="1" stop-color="#E6F0F6"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFEFB"/>
      <stop offset="1" stop-color="#F6FBFE"/>
    </linearGradient>
    <linearGradient id="frontend" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF2E3"/>
      <stop offset="1" stop-color="#FCE2C4"/>
    </linearGradient>
    <linearGradient id="runtime" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E8F5F7"/>
      <stop offset="1" stop-color="#CFE7EA"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E8EEF8"/>
      <stop offset="1" stop-color="#D5E1F2"/>
    </linearGradient>
    <linearGradient id="support" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8E9EF"/>
      <stop offset="1" stop-color="#EFD6E1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C56032"/>
      <stop offset="1" stop-color="#E29C40"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#5B7382" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1L11 6L1 11V1Z" fill="#3B5E68"/>
    </marker>
    <style>
      .title { font: 700 44px 'Segoe UI', Arial, sans-serif; fill: #17384C; }
      .subtitle { font: 500 20px 'Segoe UI', Arial, sans-serif; fill: #54707B; }
      .section { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #17384C; }
      .label { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #17384C; }
      .body { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #39535F; }
      .small { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #58727E; }
      .tiny { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #6A828D; }
      .light { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #FBFEFF; }
    </style>
  </defs>

  <rect width="1800" height="1100" rx="36" fill="url(#bg)"/>
  <circle cx="1500" cy="160" r="120" fill="#F1D7C0" opacity="0.4"/>
  <circle cx="220" cy="930" r="160" fill="#C6DFE8" opacity="0.38"/>
  <circle cx="1540" cy="910" r="100" fill="#EFC7D2" opacity="0.34"/>

  <text x="105" y="95" class="title">Kiến Trúc Tổng Thể Hệ Thống AI Caro Engine</text>
  <text x="106" y="135" class="subtitle">Mô tả các lớp chính: giao diện, runtime, lõi AI, và các khối benchmark - heuristic QA</text>

  <rect x="90" y="170" width="1620" height="850" rx="30" fill="url(#frame)" stroke="#D8E3E8" stroke-width="2" filter="url(#shadow)"/>

  <rect x="130" y="220" width="250" height="720" rx="28" fill="#FFF8EF" stroke="#E8D0B6" stroke-width="2"/>
  <text x="176" y="270" class="section">Người dùng</text>
  <rect x="160" y="310" width="190" height="110" rx="22" fill="#FFFFFF" stroke="#E7D8C6"/>
  <text x="204" y="356" class="label">Player</text>
  <text x="188" y="388" class="body">Chơi cờ, reset game,</text>
  <text x="196" y="414" class="body">chọn độ sâu / mode</text>

  <rect x="160" y="475" width="190" height="190" rx="22" fill="#FFFFFF" stroke="#E7D8C6"/>
  <text x="188" y="518" class="label">Trình duyệt</text>
  <text x="180" y="552" class="body">Hiển thị UI web</text>
  <text x="184" y="582" class="body">Tương tác canvas</text>
  <text x="175" y="612" class="body">Nhận phản hồi AI</text>

  <rect x="160" y="720" width="190" height="170" rx="22" fill="url(#accent)" filter="url(#shadow)"/>
  <text x="195" y="770" class="light">Mục tiêu</text>
  <text x="185" y="805" class="light">Chơi mượt</text>
  <text x="179" y="835" class="light">AI phản hồi nhanh</text>
  <text x="180" y="865" class="light">Thấy được metrics</text>

  <rect x="430" y="220" width="360" height="720" rx="28" fill="url(#frontend)" stroke="#E4C49E" stroke-width="2"/>
  <text x="540" y="270" class="section">Frontend UI</text>

  <rect x="465" y="310" width="290" height="115" rx="22" fill="#FFFCF7" stroke="#E7D2BA"/>
  <text x="548" y="355" class="label">index.html</text>
  <text x="496" y="388" class="body">Trang chính của ứng dụng web</text>

  <rect x="465" y="455" width="290" height="155" rx="22" fill="#FFFCF7" stroke="#E7D2BA"/>
  <text x="515" y="500" class="label">JS điều khiển UI</text>
  <text x="500" y="533" class="body">`main.js`, `ui.js`, `ui-state.js`</text>
  <text x="496" y="563" class="body">Xử lý lượt chơi và trạng thái</text>
  <text x="500" y="593" class="body">Hiển thị score, time, nodes</text>

  <rect x="465" y="640" width="290" height="120" rx="22" fill="#FFFCF7" stroke="#E7D2BA"/>
  <text x="499" y="686" class="label">Canvas Board</text>
  <text x="482" y="720" class="body">`canvas-board.js` render bàn cờ</text>
  <text x="483" y="748" class="small">Hiển thị quân X / O trực quan</text>

  <rect x="465" y="790" width="290" height="115" rx="22" fill="#FFFCF7" stroke="#E7D2BA"/>
  <text x="505" y="835" class="label">AI Adapter</text>
  <text x="490" y="868" class="body">Kết nối UI với Worker / Engine</text>

  <rect x="840" y="220" width="420" height="720" rx="28" fill="url(#runtime)" stroke="#B9D7DD" stroke-width="2"/>
  <text x="930" y="270" class="section">Engine Runtime</text>

  <rect x="875" y="310" width="350" height="125" rx="22" fill="#FBFEFE" stroke="#C7DEE2"/>
  <text x="987" y="355" class="label">Web Worker</text>
  <text x="925" y="388" class="body">`src/engine-runtime/workers/ai-worker.js`</text>
  <text x="940" y="416" class="small">Chạy AI nền để tránh treo giao diện</text>

  <rect x="875" y="470" width="350" height="135" rx="22" fill="#FBFEFE" stroke="#C7DEE2"/>
  <text x="980" y="515" class="label">WASM Bridge</text>
  <text x="922" y="548" class="body">`wasm_bridge.cpp`, `ai.js`, `ai.wasm`</text>
  <text x="917" y="578" class="small">Chuyển dữ liệu JS sang C++ và ngược lại</text>

  <rect x="875" y="640" width="350" height="125" rx="22" fill="#FBFEFE" stroke="#C7DEE2"/>
  <text x="947" y="685" class="label">Runtime Guard</text>
  <text x="921" y="718" class="body">Quản lý timeout, an toàn runtime</text>
  <text x="925" y="746" class="small">Giữ engine ổn định khi chạy web</text>

  <rect x="875" y="795" width="350" height="110" rx="22" fill="#FBFEFE" stroke="#C7DEE2"/>
  <text x="971" y="840" class="label">Rules Engine</text>
  <text x="929" y="872" class="body">Kiểm tra luật, thắng - hòa, trạng thái</text>

  <rect x="1310" y="220" width="360" height="540" rx="28" fill="url(#core)" stroke="#C4D3E7" stroke-width="2"/>
  <text x="1398" y="270" class="section">C++ AI Core</text>

  <rect x="1345" y="310" width="290" height="110" rx="22" fill="#FFFFFF" stroke="#D4DDED"/>
  <text x="1422" y="355" class="label">Search Engine</text>
  <text x="1382" y="388" class="body">Minimax + Alpha-Beta</text>

  <rect x="1345" y="450" width="290" height="110" rx="22" fill="#FFFFFF" stroke="#D4DDED"/>
  <text x="1400" y="495" class="label">Heuristic</text>
  <text x="1376" y="528" class="body">Evaluation Function</text>

  <rect x="1345" y="590" width="290" height="135" rx="22" fill="#FFFFFF" stroke="#D4DDED"/>
  <text x="1382" y="635" class="label">Candidate Generation</text>
  <text x="1380" y="668" class="body">Giảm nhánh bằng chọn ô gần</text>
  <text x="1403" y="696" class="small">và xếp hạng nước đi</text>

  <rect x="1310" y="790" width="360" height="150" rx="28" fill="url(#support)" stroke="#D9BCC9" stroke-width="2"/>
  <text x="1384" y="840" class="section">Hỗ trợ đánh giá</text>
  <text x="1355" y="875" class="body">`heuristic-qa`: weights, scenarios, tools</text>
  <text x="1354" y="905" class="body">`benchmark`: runner, raw metrics, summary</text>

  <path d="M350 365H430" stroke="#3B5E68" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M790 845H840" stroke="#3B5E68" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1260 370H1310" stroke="#3B5E68" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1490 760V790" stroke="#3B5E68" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1490 725V760" stroke="#3B5E68" stroke-width="5"/>
  <path d="M1225 860H1310" stroke="#836776" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
  <path d="M1490 790V760" stroke="#836776" stroke-width="4" stroke-dasharray="10 10"/>

  <path d="M610 425V455" stroke="#856C58" stroke-width="4" stroke-dasharray="8 8"/>
  <path d="M610 610V640" stroke="#856C58" stroke-width="4" stroke-dasharray="8 8"/>
  <path d="M610 760V790" stroke="#856C58" stroke-width="4" stroke-dasharray="8 8"/>
  <path d="M1050 435V470" stroke="#5C8088" stroke-width="4" stroke-dasharray="8 8"/>
  <path d="M1050 605V640" stroke="#5C8088" stroke-width="4" stroke-dasharray="8 8"/>
  <path d="M1050 765V795" stroke="#5C8088" stroke-width="4" stroke-dasharray="8 8"/>

  <rect x="450" y="975" width="900" height="60" rx="18" fill="#FFFFFF" stroke="#D9E3E8" stroke-width="2"/>
  <text x="490" y="1014" class="body">Luồng chính: Người chơi → Frontend UI → AI Adapter → Worker → WASM Bridge → C++ AI Core → trả nước đi và metrics về giao diện</text>

  <text x="104" y="1065" class="tiny">Gợi ý khi thuyết trình: đọc theo chiều từ trái sang phải, sau đó nhấn mạnh hai khối giá trị nhất là C++ AI Core và heuristic-qa.</text>
</svg>
